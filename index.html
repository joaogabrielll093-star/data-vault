
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DATA VAULT</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 25px;
  background: #0b1020;
  color: #fff;
  font-family: Arial, sans-serif;
}
.container {
  max-width: 480px;
  margin: 45px auto;
  padding: 25px;
  background: #151d32;
  border-radius: 16px;
}
h1 { color: #4da3ff; text-align: center; }
p { color: #aab5ca; }
input, textarea, button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: 0;
  border-radius: 8px;
}
input, textarea {
  background: #26334d;
  color: white;
}
button {
  background: #2478db;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
.item {
  background: #26334d;
  padding: 14px;
  margin-top: 12px;
  border-radius: 9px;
  overflow-wrap: anywhere;
}
.hidden { display: none; }
</style>
</head>
<body>

<div class="container" id="login">
<h1>DATA VAULT</h1>
<p style="text-align:center">Seu cofre digital</p>
<input type="password" id="senha" placeholder="Senha de acesso">
<button onclick="entrar()">Acessar cofre</button>
</div>

<div class="container hidden" id="cofre">
<h1>DATA VAULT</h1>
<p>Armazenamento de informações</p>

<input id="titulo" placeholder="Nome do registro">
<textarea id="dados" placeholder="Informações"></textarea>
<button onclick="salvar()">Salvar registro</button>

<h3>Meus registros</h3>
<div id="lista"></div>

<button onclick="bloquear()" style="background:#a83245">
Bloquear cofre
</button>
</div>

<script>
const SENHA = "1234";
let registros = JSON.parse(localStorage.getItem("vault") || "[]");

function entrar() {
  if (document.getElementById("senha").value === SENHA) {
    login.classList.add("hidden");
    cofre.classList.remove("hidden");
    atualizar();
  } else {
    alert("Senha incorreta!");
  }
}

function salvar() {
  const titulo = document.getElementById("titulo").value.trim();
  const dados = document.getElementById("dados").value.trim();

  if (!titulo || !dados) {
    alert("Preencha os campos!");
    return;
  }

  registros.push({titulo, dados});
  localStorage.setItem("vault", JSON.stringify(registros));

  document.getElementById("titulo").value = "";
  document.getElementById("dados").value = "";
  atualizar();
}

function atualizar() {
  const lista = document.getElementById("lista");
  lista.replaceChildren();

  registros.forEach((r, i) => {
    const item = document.createElement("div");
    item.className = "item";

    const nome = document.createElement("strong");
    nome.textContent = r.titulo;

    const conteudo = document.createElement("p");
    conteudo.textContent = r.dados;

    const excluir = document.createElement("button");
    excluir.textContent = "Excluir";
    excluir.style.background = "#a83245";
    excluir.onclick = () => {
      registros.splice(i, 1);
      localStorage.setItem("vault", JSON.stringify(registros));
      atualizar();
    };

    item.append(nome, conteudo, excluir);
    lista.appendChild(item);
  });
}

function bloquear() {
  cofre.classList.add("hidden");
  login.classList.remove("hidden");
  document.getElementById("senha").value = "";
}
</script>
</body>
</html>
